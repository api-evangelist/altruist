separation:
  note: >-
    Each environment has its own set of authentication details. Sandbox
    credentials will not work in production, and the base URLs differ between
    sandbox and production.
test_values:
  note: >-
    Altruist does not publish self-service magic test credentials or fixture
    values; sandbox client_id/client_secret and test user credentials are issued
    by Altruist to approved partners on request via https://altruist.com/build-with-us/.
