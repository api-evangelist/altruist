                    data:
                      account_id: b14233218302b48cdc8164ea4bb55adb730437535e0853e9c9801d366c61214f
                      cost_basis:
                      - id: f5b46399dcd17b3a6e4f7142801a32742b3e56c3fa8216a4b518f0e78a91aac2
                        cusip: 46429B663
                        symbol: HDV
                        description: ISHARES CORE HIGH DIVIDEND ETF
                        quantity: 50
                        market_value: 5100
                        cost_basis_unadjusted: 5000
                        cost_basis_adjusted: 5000
                        unrealized_gain_loss: 100
                        as_of_date: 2022/08/15
                        open_date: 2022/01/15
                      - id: 12c0039fffadcb3a3a07b263497dfd3e12c784c85fe4797e07ec1197db396180
                        cusip: 46429B663
                        symbol: EFA
                        description: ISHARES MSCI EAFE ETF
                        quantity: 100
                        market_value: 7200
                        cost_basis_unadjusted: 4000
                        cost_basis_adjusted: 4000
                        unrealized_gain_loss: 3200
                        as_of_date: 2022/08/15
                        open_date: 2021/07/10
        '400':
          description: Bad request error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                first:
                  value:
                    error_type: bad_request
                    message: invalid or missing user id
        '403':
          description: Unauthorized error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                first:
                  value:
                    error_type: unauthorized
                    message: user is not authorized
        '404':
          description: Not found error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                first:
                  value:
                    error_type: resource_not_found
                    message: Account not found
        '500':
          description: Internal error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                first:
                  value:
                    error_type: internal_error
                    message: unable to connect to the data source
      security:
      - Authorization:
        - cost_basis:read
components:
  schemas:
    CostBasisEntity:
      type: object
      description: A description of an Unrealized Cost Basis entity for a given Position
      required:
      - id
      - cusip
      - symbol
      - quantity
      - cost_basis_unadjusted
      - unrealized_gain_loss
      - as_of_date
      - open_date
      properties:
        id:
          type: string
          example: a7b2c2b8ecdf992cd248877b4df9ecc57e035b5ce27a32a4d3850896bcf7a2d9
          description: the id has length of 64 lower-case alphanumeric chars
        cusip:
          type: string
          example: 46429B663
        symbol:
          type: string
          example: HDV
        description:
          type: string
          example: ISHARES CORE HIGH DIVIDEND ETF
        quantity:
          type: number
          example: 50
        market_value:
          type: number
          example: 5100
        cost_basis_unadjusted:
          type: number
          example: 5000
        cost_basis_adjusted:
          type: number
          example: 4990.01
        unrealized_gain_loss:
          type: number
          example: 109.99
        as_of_date:
          type: string
          example: 2021/03/11
        open_date:
          type: string
          example: 2021/03/11
    Pagination:
      type: object
      description: Description of a paginated response
      properties:
        page:
          type: integer
          format: int32
          description: Desired page number, default is 0
          default: 0
          example: 1
        page_size:
          type: integer
          format: int32
          description: Page size, default is 100 items
          default: 100
          example: 25
        total_pages:
          type: integer
          format: int32
          description: Total number of pages
          default: 1
          example: 3
      required:
      - page
      - page_size
      - total_pages
    CostBasis:
      type: object
      description: A description of unrealized cost basis for positions within a given account
      properties:
        account_id:
          type: string
          description: Account Id
          example: 20f2d5c4ef1a51e6d0a002518b1da224fe64f5a60d458dcbc5cb25231af3bed8
        cost_basis:
          type: array
          description: A list of Cost Basis
          items:
            $ref: '#/components/schemas/CostBasisEntity'
    Error:
      type: object
      required:
      - error_type
      - message
      properties:
        error_type:
          type: string
          description: Describes the type or source of error
          enum:
          - internal_error
          - bad_request
          - dependency_unavailable
          - resource_not_found
          - resource_already_exists
          - unauthorized
          example: unauthorized
        message:
          type: string
          description: Error message corresponding to the error code
          example: User is not authorized
  securitySchemes:
    Authorization:
      type: http
      scheme: bearer
      description: Access Token
