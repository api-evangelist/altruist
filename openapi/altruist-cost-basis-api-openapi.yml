        required: false
        schema:
          type: integer
          format: int32
        example: 10
      - name: page_size
        in: query
        description: desired number of entries per page, defaults to 100, max value is 1000
        required: false
        schema:
          type: integer
          format: int32
        example: 25
      responses:
        '200':
          description: A successful response for /cost-basis request
          content:
