openapi: 3.2.0
info:
  title: Enterprise Realtime Trusted Contact API
  description: The Enterprise Realtime API service acts as the public API layer for advisor infrastructure, enabling partner-developers to programmatically perform advisor actions.
  version: v1
servers:
- url: https://integrations.altruist.com
  description: API Server
tags:
- name: Trusted Contact
  description: Trusted contact management
paths:
  /api/v1/orgs/{orgId}/households/{householdId}/accounts/drafts/{accountDraftId}/trustedContact:
    get:
      tags:
      - Trusted Contact
      operationId: getTrustedContact
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: householdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountDraftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '422':
          description: Unprocessable Entity
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TrustedContactV1'
      summary: Get trusted contact
      x-summary-source: derived
    put:
      tags:
      - Trusted Contact
      operationId: updateTrustedContact
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: householdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountDraftId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrustedContactV1'
        required: true
      responses:
        '400':
          description: Bad Request
