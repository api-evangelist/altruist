              schema:
                $ref: '#/components/schemas/ErrorV1'
components:
  schemas:
    CashSetAsideValidationRequestV1:
      type: object
      properties:
        amount:
          type: number
        asideUntil:
          type: string
          format: date
        note:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - amount
      - asideUntil
    ErrorV1:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: '### Error Codes


            | Code   | Description                         |

            |--------|-------------------------------------|

            | **0xx** | **Unknown or Unexpected**          |

            | 0    | Unknown error                         |

            | 40   | Unknown authentication error          |

            | **1xx** | **General**                        |

            | 101  | Invalid input                         |

            | 104  | Not found                             |

            | 140  | Access Denied                         |

            | 141  | Unauthorized                          |

            | 150  | Not implemented                       |

            | **10xx** | **Household**                     |

            | 1000 | Household not found                   |

            | 1001 | Duplicate contact                     |

            | 1002 | Household contact not found           |

            | 1003 | Household contact already exists      |

            | **11xx** | **Account**                       |

            | 1100 | Account not found                     |

            | 1110 | Invalid account group                 |

            | **12xx** | **User**                          |

            | 1200 | User not found                        |

            | 1201 | User profile not found                |

            | **13xx** | **Transfer**                      |

            | 1300 | Transfer not found                    |

            | 1301 | Transfer not supported                |

            | 1302 | Duplicate transfer                    |

            | 1303 | Funding account not found             |

            | 1304 | Duplicate funding account             |

            | **14xx** | **Client Agreement**              |

            | 1400 | Client Agreement not found            |

            | 1401 | Invalid Client Agreement file         |

            | 1402 | Client Agreement could not be updated |

            | **15xx** | **Trusted Contact**               |

            | 1500 | Trusted Contact not found             |

            | **17xx** | **Cash Set Aside**                |

            | 1700 | Cash set aside not found              |

            | 1701 | Cash set aside invalid amount         |

            | 1702 | Cash set aside invalid date           |

            | 1703 | Cash set aside upstream error         |

            | 1704 | Cash set aside cannot be cancelled    |

            | 1705 | Cash set aside invalid account        |

            | **18xx** | **Cash Settings**                 |

            | 1800 | Cash settings not found               |

            '
        message:
          type: string
        requestId:
          type: string
    CreateCashSetAsideRequestV1:
      type: object
      properties:
        amount:
          type: number
        asideUntil:
          type: string
          format: date
        note:
          type: string
          maxLength: 255
          minLength: 0
        shouldRebalanceAsap:
          type: boolean
      required:
      - amount
      - asideUntil
    CashSetAsideValidationV1:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        amount:
          type: number
        aum:
          type: number
        currentCashBalance:
          type: number
        newCashTarget:
          type: number
        amountSetAside:
          type: number
        asideUntil:
          type: string
          format: date
        note:
          type: string
        isRebalancerNeeded:
          type: boolean
    CashSetAsideV1:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        amount:
          type: number
        setAsideAmount:
          type: number
        setAsidePendingAmount:
          type: number
        status:
          type: string
          enum:
          - Pending
          - Ready
          - Processing
          - Complete
          - Cancelled
          - Expired
          - Failed
        asideUntil:
          type: string
          format: date
        withdrawalAmount:
          type: number
        note:
          type: string
        createdDate:
          type: string
          format: date-time
        updatedDate:
          type: string
          format: date-time
    CashSetAsidePageResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CashSetAsideV1'
        page:
          $ref: '#/components/schemas/PageInfo'
    PageInfo:
      type: object
      properties:
        number:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
