components:
  schemas:
    Pagination:
      type: object
      description: Description of a paginated response
      properties:
        page:
          type: integer
          format: int32
          description: Desired page number, default is 0
          default: 0
          example: 1
        page_size:
          type: integer
          format: int32
          description: Page size, default is 100 items
          default: 100
          example: 25
        total_pages:
          type: integer
          format: int32
          description: Total number of pages
          default: 1
          example: 3
      required:
      - page
      - page_size
      - total_pages
    Households:
      description: A list of household/household id-s and names associated with a user
      type: object
      properties:
        households:
          description: A list of household/household id-s and names
          type: array
          items:
            $ref: '#/components/schemas/Household'
    Household:
      type: object
      description: A description of a household or a household
      required:
      - id
      properties:
        id:
          type: string
          example: be68a94aa8f2f0aa1e345f8a8fbebf3602b2246d3382f69fbd708d3c46e9962b
          description: the id has length of 64 lower-case alphanumeric chars
        name:
          type: string
          example: The Rogers Family
    Error:
      type: object
      required:
      - error_type
      - message
      properties:
        error_type:
          type: string
          description: Describes the type or source of error
          enum:
          - internal_error
          - bad_request
          - dependency_unavailable
          - resource_not_found
          - resource_already_exists
          - unauthorized
          example: unauthorized
        message:
          type: string
          description: Error message corresponding to the error code
          example: User is not authorized
    Accounts:
      type: object
      description: A description of Accounts associated with a given Household/Household
      properties:
        household_id:
          type: string
          description: An ID of the Household/Household
          example: f2e7d7530b68dee392284b2ce9c49075d63478502ea4c9de74c41ce6b8d2c5f0
        accounts:
          type: array
          description: A list of Accounts
          items:
            $ref: '#/components/schemas/Account'
    Account:
      type: object
      description: A description of an investment Account
      required:
      - id
      - rep_code
      - account_number
      - account_type
      - account_name
      - as_of_date
      - account_balance
      properties:
        id:
          type: string
          example: 114233218302b48cdc8164ea4bb55adb730437535e0853e9c9801d366c61214f
          description: the id has length of 64 lower-case alphanumeric chars
        rep_code:
          type: string
          example: 3AAABC
        account_number:
          type: string
          example: 3AA08867
        account_type:
          type: string
          example: INDIVIDUAL
        account_name:
          type: string
          example: Self-directed IRA
        status:
          type: string
          example: ACTIVE
        date_open:
          type: string
          example: 2020/09/18
        date_closed:
          type: string
          example: 2020/11/25
        as_of_date:
          type: string
          example: 2021/03/11
        account_balance:
          type: number
          example: 5607.65
    Positions:
      type: object
      description: A description of positions within a given account
      properties:
        account_id:
          type: string
          description: Account Id
          example: 20f2d5c4ef1a51e6d0a002518b1da224fe64f5a60d458dcbc5cb25231af3bed8
        positions:
          type: array
          description: A list of Positions
          items:
            $ref: '#/components/schemas/Position'
    Position:
      type: object
      description: A description of a Position
      required:
      - id
      - cusip
      - symbol
      - currency_code
      - quantity
      - as_of_date
      properties:
        id:
          type: string
          example: 730f75dafd73e047b86acb2dbd74e75dcb93272fa084a9082848f2341aa1abb6
          description: the id has length of 64 lower-case alphanumeric chars
        cusip:
          type: string
          example: 46429B663
        symbol:
          type: string
          example: HDV
        description:
          type: string
          example: ISHARES CORE HIGH DIVIDEND ETF
        security_type:
          type: string
          example: null
        currency_code:
          type: string
          example: USD
        quantity:
          type: number
          example: 50
        market_value:
          type: number
          example: 5100
        price:
          type: number
          example: 20
        as_of_date:
          type: string
          example: 2021/03/11
    CostBasis:
      type: object
      description: A description of unrealized cost basis for positions within a given account
      properties:
        account_id:
          type: string
          description: Account Id
          example: 20f2d5c4ef1a51e6d0a002518b1da224fe64f5a60d458dcbc5cb25231af3bed8
        cost_basis:
          type: array
          description: A list of Cost Basis
          items:
            $ref: '#/components/schemas/CostBasisEntity'
    CostBasisEntity:
      type: object
      description: A description of an Unrealized Cost Basis entity for a given Position
      required:
      - id
      - cusip
      - symbol
      - quantity
      - cost_basis_unadjusted
      - unrealized_gain_loss
      - as_of_date
      - open_date
      properties:
        id:
          type: string
          example: a7b2c2b8ecdf992cd248877b4df9ecc57e035b5ce27a32a4d3850896bcf7a2d9
          description: the id has length of 64 lower-case alphanumeric chars
        cusip:
          type: string
          example: 46429B663
        symbol:
          type: string
          example: HDV
        description:
          type: string
          example: ISHARES CORE HIGH DIVIDEND ETF
        quantity:
          type: number
          example: 50
        market_value:
          type: number
          example: 5100
        cost_basis_unadjusted:
          type: number
          example: 5000
        cost_basis_adjusted:
          type: number
          example: 4990.01
        unrealized_gain_loss:
          type: number
          example: 109.99
        as_of_date:
          type: string
          example: 2021/03/11
        open_date:
          type: string
          example: 2021/03/11
    Transactions:
      type: object
      description: A description of Transactions within a given Account
      properties:
        account_number:
          type: string
          description: Account number
          example: 3AA08867
        transactions:
          type: array
          description: A list of Transactions
          items:
            $ref: '#/components/schemas/Transaction'
    Transaction:
      type: object
      description: A description of a Transaction
      required:
      - id
      - cusip
      - symbol
      - amount
      - currency_code
      - transaction_type
      - detailed_transaction_type
      - cancellation_reversal_flag
      - transaction_description
      - transaction_date
      - quantity
      - price
      - settle_date
      - as_of_date
      properties:
        id:
          type: string
          example: 64a6c31ce048538c952ace2451b1998efc9bca16c8f7292efc21a416e1054267
          description: the id has length of 64 lower-case alphanumeric chars
