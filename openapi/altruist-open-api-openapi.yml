  /api/v1/households:
    get:
      summary: Get a list of household/household ID-s for the current user
      description: Get households/households for the current user. Returns a list of ID-s and names of households/households associated with the current user. If a user is a household, returns a household ID associated with that household. If a user is an advisor, returns a list of household ID-s associated with the advisor
      operationId: listHouseholds
      tags:
      - households
      parameters:
      - name: page
        in: query
        description: desired page number, defaults to 0
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      - name: page_size
        in: query
        description: desired number of entries per page, defaults to 100, max value is 1000
        required: false
        schema:
          type: integer
          format: int32
        example: 25
      - name: name_pattern
        in: query
        description: a case-insensitive pattern which if specified must be contained within household or household name
        required: false
        schema:
          type: string
        example: Smith
      - name: X-API-Request-ID
        in: header
        description: household-provided request id
        required: false
        schema:
          type: string
        example: 2f047e95
      responses:
        '200':
          description: A successful response for /households request
          content:
