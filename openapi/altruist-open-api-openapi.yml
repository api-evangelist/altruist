              schema:
                type: object
                properties:
                  paging:
                    $ref: '#/components/schemas/Pagination'
                  data:
                    $ref: '#/components/schemas/Households'
              examples:
                first:
                  value:
                    paging:
                      page: 1
                      page_size: 25
                      total_pages: 3
                    data:
                      households:
                      - id: ba24a2890228ef70a16259bb9b72fb1b42ad5f29d7c60a0298456adb4ee11737
                        name: The Rogers Family
                      - id: ba24a2890228ef70a16259bb9b72fb1b42ad5f29d7c60a0298456adb4ee11737
                        name: Scott Brown
