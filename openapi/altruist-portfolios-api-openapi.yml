components:
  schemas:
    SecurityV1:
      type: object
      properties:
        name:
          type: string
        symbol:
          type: string
    WeightedModelV1:
      type: object
      properties:
        weight:
          type: number
        model:
          $ref: '#/components/schemas/ModelV1'
    PortfolioV1:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum:
          - Custom
          - UMA
          - ModelMarketplace
          - PersonalizedDirectIndex
          - Unknown
        fee:
          type: string
        investmentMinimum:
          type: number
        rebalanceTrigger:
          type: string
          enum:
          - Drift
          - Event
          - Manual
          - Unknown
        driftTolerance:
          type: number
        cashManagement:
          type: string
          enum:
          - Model
          - Separate
          - Unknown
        cashTarget:
          type: number
        minimumTradeValue:
          type: number
        minimumTradePercentage:
          type: number
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    WeightedSecurityV1:
      type: object
      properties:
        weight:
          type: number
        security:
          $ref: '#/components/schemas/SecurityV1'
    PageResponsePortfolioV1:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/PortfolioV1'
    PageResponseWeightedSecurityV1:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeightedSecurityV1'
    PageResponseWeightedModelV1:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/WeightedModelV1'
    ModelV1:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
          - Marketplace
          - Custom
          - ModelMarketplaceBranch
          - PersonalizedDirectIndex
        status:
          type: string
          enum:
          - Pending
          - Failed
          - Active
          - Inactive
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
    ErrorV1:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: '### Error Codes


            | Code   | Description                         |

            |--------|-------------------------------------|

            | **0xx** | **Unknown or Unexpected**          |

            | 0    | Unknown error                         |

            | 40   | Unknown authentication error          |

            | **1xx** | **General**                        |

            | 101  | Invalid input                         |

            | 104  | Not found                             |

            | 140  | Access Denied                         |

            | 141  | Unauthorized                          |

            | 150  | Not implemented                       |

            | **10xx** | **Household**                     |

            | 1000 | Household not found                   |

            | 1001 | Duplicate contact                     |

            | 1002 | Household contact not found           |

            | 1003 | Household contact already exists      |

            | **11xx** | **Account**                       |

            | 1100 | Account not found                     |

            | 1110 | Invalid account group                 |

            | **12xx** | **User**                          |

            | 1200 | User not found                        |

            | 1201 | User profile not found                |

            | **13xx** | **Transfer**                      |

            | 1300 | Transfer not found                    |

            | 1301 | Transfer not supported                |

            | 1302 | Duplicate transfer                    |

            | 1303 | Funding account not found             |

            | 1304 | Duplicate funding account             |

            | **14xx** | **Client Agreement**              |

            | 1400 | Client Agreement not found            |

            | 1401 | Invalid Client Agreement file         |

            | 1402 | Client Agreement could not be updated |

            | **15xx** | **Trusted Contact**               |

            | 1500 | Trusted Contact not found             |

            | **17xx** | **Cash Set Aside**                |

            | 1700 | Cash set aside not found              |

            | 1701 | Cash set aside invalid amount         |

            | 1702 | Cash set aside invalid date           |

            | 1703 | Cash set aside upstream error         |

            | 1704 | Cash set aside cannot be cancelled    |

            | 1705 | Cash set aside invalid account        |

            | **18xx** | **Cash Settings**                 |

            | 1800 | Cash settings not found               |

            '
        message:
          type: string
        requestId:
          type: string
