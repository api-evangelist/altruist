        fee:
          type: string
        investmentMinimum:
          type: number
        rebalanceTrigger:
          type: string
          enum:
          - Drift
          - Event
          - Manual
          - Unknown
        driftTolerance:
          type: number
        cashManagement:
          type: string
          enum:
