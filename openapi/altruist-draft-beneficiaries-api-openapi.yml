      type: object
      description: Request to set allocation percentages for existing beneficiaries on an account draft. This endpoint only updates allocation percentages — no other beneficiary fields can be changed through it. All beneficiaries within a designation group (Primary or Contingent) must be included when any beneficiary of that group is present, and percentages must sum to exactly 100 per group.
