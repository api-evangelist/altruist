          type: array
          description: List of beneficiary allocation entries. Must not be empty. Each entry pairs an existing beneficiaryId with a percentage. No duplicate beneficiaryIds are allowed. All beneficiaries sharing the same designation (Primary or Contingent) must be included if any one of them is, and their percentages must sum to 100.
