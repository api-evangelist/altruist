openapi: 3.2.0
info:
  title: Enterprise Realtime User API
  description: The Enterprise Realtime API service acts as the public API layer for advisor infrastructure, enabling partner-developers to programmatically perform advisor actions.
  version: v1
servers:
- url: https://integrations.altruist.com
  description: API Server
tags:
- name: User
  description: User creation for records referenced by account drafts (e.g. minors, employers)
paths:
  /api/v1/orgs/{orgId}/users:
    post:
      tags:
      - User
      summary: Create a Minor or Employer user
      description: Creates a user record referenced by account drafts (e.g. minorUserId, employerUserId). The caller must be an advisor in the organization.
      operationId: createUser
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequestV1'
        required: true
      responses:
        '400':
          description: Invalid input — firstName/lastName is missing, or profileType is not Minor or Employer
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '403':
          description: Access denied — caller is not an advisor in the organization
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '401':
          description: Unauthorized — missing or invalid token
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '422':
          description: Unprocessable Entity
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'
        '429':
          description: Rate limit exceeded
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserV1'
components:
  schemas:
    UserV1:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        profileId:
          type: string
          format: uuid
        profileType:
          type: string
          enum:
          - Beneficiary
          - BeneficiaryEntity
          - TrustedContact
          - Entity
          - EntityContact
          - Advisor
          - Client
          - Minor
          - CorporationMember
          - Employer
          - ClientAccount
          - SingleParticipant
          - Unknown
    ErrorV1:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: '### Error Codes


            | Code   | Description                         |

            |--------|-------------------------------------|

            | **0xx** | **Unknown or Unexpected**          |

            | 0    | Unknown error                         |

            | 40   | Unknown authentication error          |

            | **1xx** | **General**                        |

            | 101  | Invalid input                         |

            | 104  | Not found                             |

            | 140  | Access Denied                         |

            | 141  | Unauthorized                          |

            | 150  | Not implemented                       |

            | **10xx** | **Household**                     |

            | 1000 | Household not found                   |

            | 1001 | Duplicate contact                     |

            | 1002 | Household contact not found           |

            | 1003 | Household contact already exists      |

            | **11xx** | **Account**                       |

            | 1100 | Account not found                     |

            | 1110 | Invalid account group                 |

            | **12xx** | **User**                          |

            | 1200 | User not found                        |

            | 1201 | User profile not found                |

            | **13xx** | **Transfer**                      |

            | 1300 | Transfer not found                    |

            | 1301 | Transfer not supported                |

            | 1302 | Duplicate transfer                    |

            | 1303 | Funding account not found             |

            | 1304 | Duplicate funding account             |

            | **14xx** | **Client Agreement**              |

            | 1400 | Client Agreement not found            |

            | 1401 | Invalid Client Agreement file         |

            | 1402 | Client Agreement could not be updated |

            | **15xx** | **Trusted Contact**               |

            | 1500 | Trusted Contact not found             |

            | **17xx** | **Cash Set Aside**                |

            | 1700 | Cash set aside not found              |

            | 1701 | Cash set aside invalid amount         |

            | 1702 | Cash set aside invalid date           |

            | 1703 | Cash set aside upstream error         |

            | 1704 | Cash set aside cannot be cancelled    |

            | 1705 | Cash set aside invalid account        |

            | **18xx** | **Cash Settings**                 |

            | 1800 | Cash settings not found               |

            '
        message:
          type: string
        requestId:
          type: string
    AddressV1:
      type: object
      properties:
        addr1:
          type: string
        addr2:
          type: string
        addr3:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
      required:
      - addr1
      - city
      - country
      - state
      - zipCode
    CreateUserRequestV1:
      type: object
      properties:
        profileType:
          type: string
          enum:
          - Beneficiary
          - BeneficiaryEntity
          - TrustedContact
          - Entity
          - EntityContact
          - Advisor
          - Client
          - Minor
          - CorporationMember
          - Employer
          - ClientAccount
          - SingleParticipant
          - Unknown
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        dateOfBirth:
          type: string
          format: date-time
        ssnTaxId:
          type: string
          writeOnly: true
        email:
          type: string
        phone:
          type: string
        address:
          $ref: '#/components/schemas/AddressV1'
      required:
      - firstName
      - lastName
      - profileType
