openapi: 3.2.0
info:
  title: Enterprise Realtime Account Balance API
  description: The Enterprise Realtime API service acts as the public API layer for advisor infrastructure, enabling partner-developers to programmatically perform advisor actions.
  version: v1
servers:
- url: https://integrations.altruist.com
  description: API Server
tags:
- name: Account Balance
  description: Account Summary Data
paths:
  /api/v1/orgs/{orgId}/households/{householdId}/aggregateRetirementTransactions:
    get:
      tags:
      - Account Balance
      summary: Get aggregated retirement account transactions
      description: Returns paginated aggregated IRA/retirement transaction data including distributions, contributions, RMDs, and scheduled transfers for the specified tax year
      operationId: getAggregatedTransactions
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: householdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taxYear
        in: query
        description: Tax year (defaults to current year)
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        description: Page number (1-indexed)
        required: false
        schema:
          type: integer
          format: int32
          default: 1
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '422':
          description: Unprocessable Entity
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseAggregatedTxnInfoV1'
  /api/v1/orgs/{orgId}/households/{householdId}/accounts/{accountId}/mma:
    get:
      tags:
      - Account Balance
      summary: Get MMA settings for an account
      description: Retrieves Money Movement Authorization opt-in/out settings for an account
      operationId: getMmaSettings
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: householdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '422':
          description: Unprocessable Entity
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/MmaSettingsV1'
  /api/v1/orgs/{orgId}/households/{householdId}/accounts/{accountId}/cashBalance:
    get:
      tags:
      - Account Balance
      summary: Get cash balance summary for an account
      description: Summary aggregate of cash positions, available cash balance, and pending transactions for an account
      operationId: getCashSummary
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: householdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '422':
          description: Unprocessable Entity
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CashBalanceV1'
  /api/v1/orgs/{orgId}/households/{householdId}/accounts/{accountId}/aggregateRetirementTransactions:
    get:
      tags:
      - Account Balance
      summary: Get aggregated retirement account transactions
      description: Returns aggregated IRA/retirement transaction data including distributions, contributions, RMDs, and scheduled transfers for the specified tax year
      operationId: getAggregatedTransactions_1
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: householdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taxYear
        in: query
        description: Tax year (defaults to current year)
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '422':
          description: Unprocessable Entity
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AggregatedTxnInfoV1'
components:
  schemas:
    PageResponseAggregatedTxnInfoV1:
      type: object
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/AggregatedTxnInfoV1'
    MmaSettingsV1:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hasAuthorizedMMA:
          type: boolean
        authorizedByClientIds:
          type: array
          items:
            type: string
            format: uuid
    AggregatedTxnInfoV1:
      type: object
      description: Aggregated transaction information for a single account
      properties:
        id:
          type: string
          format: uuid
          description: Financial account UUID (unique identifier)
        accountNumber:
          type: string
          description: Account number
        accountType:
          type: string
          description: Type/category of the account (e.g., IRA, ROTH_IRA)
        primaryBeneficiaryAge:
          type: integer
          format: int32
          description: Age of primary beneficiary
        distributionsYTD:
          type: number
          description: Total distributions year-to-date
        contributionsYTD:
          type: number
          description: Total contributions year-to-date
        aggregateSumOfPreviousTaxYearContributions:
          type: number
          description: Sum of contributions from previous tax year
        aggregateSumOfPreviousTaxYearDistributions:
          type: number
          description: Sum of distributions from previous tax year
        estimatedRemainingScheduledContributions:
          type: number
          description: Estimated remaining scheduled contributions
        estimatedRemainingScheduledDistributions:
          type: number
          description: Estimated remaining scheduled distributions
        yearlyMaximum:
          type: number
          description: Maximum contribution allowed for the year
        totalRmd:
          type: number
          description: Total required minimum distribution
        totalRmdPreviousYear:
          type: number
          description: Required minimum distribution from previous year
        isAutomatedRmd:
          type: boolean
          description: Whether RMD is automated
        autoRmdFrequency:
          type: string
          description: Frequency of automated RMD
          enum:
          - Weekly
          - Biweekly
          - Monthly
          - Quarterly
          - SemiAnnually
          - Annually
          - OneTime
          - Once
        requiresRmdCalculation:
          type: boolean
          description: Whether RMD calculation is required
      required:
      - id
    CashBalanceV1:
      type: object
      properties:
        id:
          type: string
          format: uuid
        balance:
          type: number
        availableForTrade:
          type: number
        availableForWithdrawal:
          type: number
        unsettledCash:
          type: number
        pendingDeposits:
          type: number
        pendingWithdrawals:
          type: number
        pendingBuyOrders:
          type: number
        pendingSellOrders:
          type: number
        currency:
          type: string
        asOfDate:
          type: string
          format: date
    ErrorV1:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: '### Error Codes


            | Code   | Description                         |

            |--------|-------------------------------------|

            | **0xx** | **Unknown or Unexpected**          |

            | 0    | Unknown error                         |

            | 40   | Unknown authentication error          |

            | **1xx** | **General**                        |

            | 101  | Invalid input                         |

            | 104  | Not found                             |

            | 140  | Access Denied                         |

            | 141  | Unauthorized                          |

            | 150  | Not implemented                       |

            | **10xx** | **Household**                     |

            | 1000 | Household not found                   |

            | 1001 | Duplicate contact                     |

            | 1002 | Household contact not found           |

            | 1003 | Household contact already exists      |

            | **11xx** | **Account**                       |

            | 1100 | Account not found                     |

            | 1110 | Invalid account group                 |

            | **12xx** | **User**                          |

            | 1200 | User not found                        |

            | 1201 | User profile not found                |

            | **13xx** | **Transfer**                      |

            | 1300 | Transfer not found                    |

            | 1301 | Transfer not supported                |

            | 1302 | Duplicate transfer                    |

            | 1303 | Funding account not found             |

            | 1304 | Duplicate funding account             |

            | **14xx** | **Client Agreement**              |

            | 1400 | Client Agreement not found            |

            | 1401 | Invalid Client Agreement file         |

            | 1402 | Client Agreement could not be updated |

            | **15xx** | **Trusted Contact**               |

            | 1500 | Trusted Contact not found             |

            | **17xx** | **Cash Set Aside**                |

            | 1700 | Cash set aside not found              |

            | 1701 | Cash set aside invalid amount         |

            | 1702 | Cash set aside invalid date           |

            | 1703 | Cash set aside upstream error         |

            | 1704 | Cash set aside cannot be cancelled    |

            | 1705 | Cash set aside invalid account        |

            | **18xx** | **Cash Settings**                 |

            | 1800 | Cash settings not found               |

            '
        message:
          type: string
        requestId:
          type: string
