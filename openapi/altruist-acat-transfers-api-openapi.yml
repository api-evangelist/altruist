        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AcatTransferV1'
    delete:
      tags:
      - ACAT Transfers
      summary: Cancel an ACAT transfer
      description: Cancels a pending ACAT transfer. Only transfers in PendingApproval or ApprovalExpired status may be cancelled.
      operationId: cancelAcatTransfer
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: householdId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: transferId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
