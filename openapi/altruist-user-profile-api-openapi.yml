openapi: 3.2.0
info:
  title: Enterprise Realtime User Profile API
  description: The Enterprise Realtime API service acts as the public API layer for advisor infrastructure, enabling partner-developers to programmatically perform advisor actions.
  version: v1
servers:
- url: https://integrations.altruist.com
  description: API Server
tags:
- name: User Profile
  description: User profile management
paths:
  /api/v1/orgs/{orgId}/users/{userId}/profile:
    get:
      tags:
      - User Profile
      operationId: getUserProfileByUserId
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '422':
          description: Unprocessable Entity
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserProfileV1'
      summary: Get user profile by user id
      x-summary-source: derived
    put:
      tags:
      - User Profile
      operationId: updateUserProfile
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileV1'
        required: true
      responses:
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '422':
          description: Unprocessable Entity
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '409':
          description: Conflict
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '502':
          description: Bad Gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorV1'
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserProfileV1'
      summary: Update user profile
      x-summary-source: derived
components:
  schemas:
    DisclosuresV1:
      type: object
      properties:
        brokerDealerAffiliation:
          type: boolean
        directorStockOwner:
          type: boolean
        politicallyExposed:
          type: boolean
        findersFeeDisclosure:
          type: boolean
        backupWithholding:
          type: boolean
        isCorrespondentEmployee:
          type: boolean
    InvestorProfileV1:
      type: object
      properties:
        investmentObjective:
          type: string
        investmentExperience:
          type: string
        investmentRiskTolerance:
          type: string
    IncomeV1:
      type: object
      properties:
        annualIncome:
          type: string
          enum:
          - 100k
          - 250k
          - 500k
          - Above500k
          - Unknown
        liquidNetWorth:
          type: string
          enum:
          - 100k
          - 250k
          - 500k
          - Above500k
          - Unknown
    AddressV1:
      type: object
      properties:
        addr1:
          type: string
        addr2:
          type: string
        addr3:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        country:
          type: string
      required:
      - addr1
      - city
      - country
      - state
      - zipCode
    ImmigrationStatusV1:
      type: object
      properties:
        countryOfBirth:
          type: string
        permanentResident:
          type: boolean
        visaType:
          type: string
          enum:
          - E1
          - E2
          - E3
          - F1
          - H1B
          - L1
          - O1
          - TN1
          - G4
          - Other
          - Unknown
        visaExpirationDate:
          type: string
          format: date-time
    EmploymentV1:
      type: object
      properties:
        employer:
          type: string
        employerAddress:
          $ref: '#/components/schemas/AddressV1'
        position:
          type: string
        industry:
          type: string
          enum:
          - AgricultureForestryFishing
          - Mining
          - Construction
          - Manufacturing
          - TransportationCommunicationsElectricGasSanitaryServices
          - WholesaleTrade
          - RetailTrade
          - FinanceInsuranceRealEstate
          - Services
          - PublicAdministration
          - AdministrativeAndSupportServices
          - AgricultureForestryFishingAndHunting
          - ArtsEntertainmentAndRecreation
          - DataProcessingHostingAndRelatedServices
          - EducationalServices
          - FinanceAndInsurance
          - HealthCareAndSocialAssistance
          - HotelsAccommodations
          - ManagementOfCompaniesAndEnterprises
          - MiningQuarryingAndOilAndGasExtraction
          - PersonalAndLaundryServices
          - PostalServiceCouriersPackageDelivery
          - PrintingAndRelatedSupportActivities
          - ProfessionalScientificAndTechnicalServices
          - PublishingIndustries
          - RealEstateAndRentalAndLeasing
          - ReligiousGrantmakingCivicProfessionalAndSimilarOrgs
          - RepairAndMaintenance
          - Telecommunications
          - Transportation
          - Utilities
          - WarehousingAndStorage
          - WasteManagementAndRemediationServices
          - Unknown
        occupation:
          type: string
          description: When occupation is Unemployed, Homemaker, Retired, or Student, the employer, position, and employerAddress fields must be null.
          enum:
          - Unemployed
          - SelfEmployed
          - Consultant
          - Executive
          - Retired
          - Student
          - Homemaker
          - AccountingAuditing
          - AdministrativeClerical
          - AdvertisingMarketing
          - AerospaceAviationDefense
          - ArtistEntertainerWriter
          - AttorneyLawParalegal
          - Automotive
          - CivilService
          - ConstructionManufacturing
          - CustomerServiceCallCenter
          - Design
          - EducationTraining
          - Engineer
          - FarmingRanchingAgriculture
          - FinancialService
          - HairStylistBeauticianEsthetician
          - HomeServicesHousekeepingLandscaping
          - HumanResources
          - InformationTechnologySystemsData
          - Insurance
          - LawEnforcementSecurity
          - MedicalVeterinarianTherapy
          - Military
          - NonProfit
          - Politics
          - RealEstate
          - RestaurantFoodServices
          - RetailCashier
          - Sales
          - Scientist
          - Transportation
          - Utilities
    ErrorV1:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: '### Error Codes


            | Code   | Description                         |

            |--------|-------------------------------------|

            | **0xx** | **Unknown or Unexpected**          |

            | 0    | Unknown error                         |

            | 40   | Unknown authentication error          |

            | **1xx** | **General**                        |

            | 101  | Invalid input                         |

            | 104  | Not found                             |

            | 140  | Access Denied                         |

            | 141  | Unauthorized                          |

            | 150  | Not implemented                       |

            | **10xx** | **Household**                     |

            | 1000 | Household not found                   |

            | 1001 | Duplicate contact                     |

            | 1002 | Household contact not found           |

            | 1003 | Household contact already exists      |

            | **11xx** | **Account**                       |

            | 1100 | Account not found                     |

            | 1110 | Invalid account group                 |

            | **12xx** | **User**                          |

            | 1200 | User not found                        |

            | 1201 | User profile not found                |

            | **13xx** | **Transfer**                      |

            | 1300 | Transfer not found                    |

            | 1301 | Transfer not supported                |

            | 1302 | Duplicate transfer                    |

            | 1303 | Funding account not found             |

            | 1304 | Duplicate funding account             |

            | **14xx** | **Client Agreement**              |

            | 1400 | Client Agreement not found            |

            | 1401 | Invalid Client Agreement file         |

            | 1402 | Client Agreement could not be updated |

            | **15xx** | **Trusted Contact**               |

            | 1500 | Trusted Contact not found             |

            | **17xx** | **Cash Set Aside**                |

            | 1700 | Cash set aside not found              |

            | 1701 | Cash set aside invalid amount         |

            | 1702 | Cash set aside invalid date           |

            | 1703 | Cash set aside upstream error         |

            | 1704 | Cash set aside cannot be cancelled    |

            | 1705 | Cash set aside invalid account        |

            | **18xx** | **Cash Settings**                 |

            | 1800 | Cash settings not found               |

            '
        message:
          type: string
        requestId:
          type: string
    UserProfileV1:
      type: object
      properties:
        firstName:
          type: string
        middleName:
          type: string
        lastName:
          type: string
        suffix:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          $ref: '#/components/schemas/AddressV1'
        mailingAddress:
          $ref: '#/components/schemas/AddressV1'
        employment:
          $ref: '#/components/schemas/EmploymentV1'
        income:
          $ref: '#/components/schemas/IncomeV1'
        maritalStatus:
          type: string
          enum:
          - Single
          - Married
        dateOfBirth:
          type: string
          format: date-time
        citizenship:
          type: string
        ssnTaxId:
          type: string
          writeOnly: true
        taxPayer:
          type: boolean
        disclosures:
          $ref: '#/components/schemas/DisclosuresV1'
        investorProfile:
          $ref: '#/components/schemas/InvestorProfileV1'
        signedBy:
          type: string
        profileType:
          type: string
          enum:
          - Beneficiary
          - BeneficiaryEntity
          - TrustedContact
          - Entity
          - EntityContact
          - Advisor
          - Client
          - Minor
          - CorporationMember
          - Employer
          - ClientAccount
          - SingleParticipant
          - Unknown
        immigrationStatus:
          $ref: '#/components/schemas/ImmigrationStatusV1'
        optInLendingProgram:
          type: boolean
        spouseDateOfBirth:
          type: string
          format: date-time
      required:
      - firstName
      - lastName
