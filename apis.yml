name: Altruist
description: >-
  Altruist is a modern, vertically integrated RIA custodian and technology
  platform for independent financial advisors. It combines self-clearing custody
  infrastructure with software for digital account opening, fractional
  model-based trading, rebalancing, tax management, fee billing, and performance
  reporting in a single workspace. Altruist runs a developer program with an
  OAuth 2.0 Open API (accounts, households, positions, transactions, cost basis),
  a Realtime API (account onboarding, funding, transfers, contacts, bank-link,
  time-weighted return), and custodial flat-file (SFTP) data feeds, so advisor
  tools and fintech partners such as Orion, Tamarac, Black Diamond, and Advyzon
  can integrate directly with the custodian. Backed by ICONIQ Capital and Insight
  Partners.
